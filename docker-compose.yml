services:
  agora-backend:
    build:
      context: ./agora-backend
      dockerfile: Dockerfile
    container_name: agora-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - MCP_API_KEY=agora-secret-key-change-me
      - CORS_ORIGIN=*
      - ENVIRONMENT=development
    volumes:
      - agora_data:/data

  agora-frontend:
    build:
      context: ./agora-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: agora-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - agora-backend

volumes:
  agora_data:
