<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e"/>
      <stop offset="50%" stop-color="#090d0b"/>
      <stop offset="100%" stop-color="#050706"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Basket Body Gradient -->
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Subtle Outer Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Main Agora Basket Symbol -->
  <g filter="url(#glowShadow)">
    <!-- Basket Handle (Arched) -->
    <path d="M 196 210 V 162 C 196 128.86 222.86 102 256 102 C 289.14 102 316 128.86 316 162 V 210" 
          fill="none" 
          stroke="url(#handleGrad)" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Basket Body - Modern Geometric Contour -->
    <path d="M 126 212 
             C 126 201 135 192 146 192 
             H 366 
             C 377 192 386 201 386 212 
             L 364 366 
             C 362 382 348 394 332 394 
             H 180 
             C 164 394 150 382 148 366 
             Z" 
          fill="url(#basketGrad)"/>

    <!-- Geometric Basket Grid Slots / Cutouts for depth -->
    <g fill="#09140e" opacity="0.45" filter="url(#softShadow)">
      <rect x="174" y="228" width="22" height="110" rx="11"/>
      <rect x="219" y="228" width="22" height="126" rx="11"/>
      <rect x="271" y="228" width="22" height="126" rx="11"/>
      <rect x="316" y="228" width="22" height="110" rx="11"/>
    </g>

    <!-- Gloss Highlight across top rim -->
    <path d="M 136 200 H 376" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Floating Badge: Dynamic Checkmark (Signifying AI & Done) -->
    <g transform="translate(256, 300)">
      <circle r="44" fill="#090d0b" stroke="#34d399" stroke-width="8"/>
      <!-- Glowing Checkmark -->
      <path d="M -18 0 L -4 14 L 20 -12" 
            fill="none" 
            stroke="url(#checkGrad)" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sparkle Accent (Hermes AI Touch) -->
  <g transform="translate(380, 130)" opacity="0.9">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#6ee7b7"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(130, 150)" opacity="0.6">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#34d399"/>
  </g>
</svg>
