apiVersion: apps/v1
kind: Deployment
metadata:
  name: agora-frontend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agora-frontend
  template:
    metadata:
      labels:
        app: agora-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx unprivileged user
        fsGroup: 101
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: frontend
          image: ghcr.io/victoragahi/agora-frontend:b228b1b0614233538e7efde9c153505669d73ff6
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
