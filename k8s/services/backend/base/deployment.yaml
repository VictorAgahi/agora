apiVersion: apps/v1
kind: Deployment
metadata:
  name: agora-backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on PVC requires single pod access
  selector:
    matchLabels:
      app: agora-backend
  template:
    metadata:
      labels:
        app: agora-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: backend
          image: ghcr.io/victoragahi/agora-backend:dfb451bad23356b6630df9a40677bde7f3d8d194
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: "/data"
            - name: ENVIRONMENT
              value: "production"
            - name: CORS_ORIGIN
              value: "https://agora.cyrus-ag.com"
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agora-backend-secret
                  key: mcp-api-key
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agora-backend-data
